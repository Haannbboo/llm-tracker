# Metadata only: installers still use requirements.txt and copy the tree (phase 9 wires packaging).
[project]
name = "tokenage-protocol"
description = "tokenage wire schemas shared by client and server (versioned with the server)"
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { file = ["../VERSION"] }
dependencies = { file = ["requirements.txt"] }
