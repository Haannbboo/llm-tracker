pricing:
  # Auto-fetch model pricing from LiteLLM on startup and config refresh.
  # Prices are cached locally at ~/.llm-tracker/litellm_pricing.json.
  # Set to false to disable and rely on YAML-only pricing.
  auto_fetch: true

evaluation:
  auto_enabled: true
  quiet_delay_seconds: 600
  max_concurrent_jobs: 1
  queue_buffer_multiplier: 2
  idle_sleep_cap_seconds: 30
  worker_tick_timeout_seconds: 120
  # Evaluator agent to use for transcript evaluation subprocess.
  # Supported: "codex" (default), "claude"
  evaluator: codex

models:
  # Pricing is auto-fetched from LiteLLM. Only add cost blocks here to
  # override specific models (e.g. enterprise discounts, custom models).

  # Models not covered by LiteLLM
  minimax-m2.7-highspeed:
    cost:
      input: 0.6
      output: 2.4
      cacheRead: 0.06
  minimax-m2.5-highspeed:
    cost:
      input: 0.6
      output: 2.4
      cacheRead: 0.03

  # Z-AI / GLM (not in LiteLLM)
  z-ai/glm-5.1-20260406:
    cost:
      input: 0.98
      output: 3.08
      cacheRead: 0.182

  # Xiaomi Mimo (not in LiteLLM)
  mimo-v2-omni:
    cost:
      input: 0.4
      output: 2.0
      cacheRead: 0.08

  # Doubao (Volcengine)
  doubao-seed-2-1-turbo-260628:
    cost:
      input: 0.42
      output: 2.1
      cacheRead: 0.084

providers:
  my-provider:
    base_url: https://api.example.com/v1
    # api_key: sk-...          # optional; client Authorization is always stripped; if set, proxy injects Bearer <key>
    models:
      gemini-3.1-pro-preview: {}
      claude-sonnet-4-6: {}
      gpt-5.4: {}
  openrouter:
    base_url: https://openrouter.ai/api/v1
    # api_key: sk-or-...       # optional; client Authorization is always stripped; if set, proxy injects Bearer <key>
    models:
      claude-sonnet-4-6: {}
      claude-haiku-4-5: {}
      gpt-5.4: {}
      gpt-5.4-mini: {}
      gemini-2.5-pro: {}
      gemini-2.5-flash: {}
  anthropic:
    base_url: https://api.anthropic.com/v1
    # api_key: sk-ant-...       # optional; if set, proxy sends it as x-api-key (Anthropic's native scheme) instead of Bearer
    # auth_scheme: x-api-key    # required alongside api_key above for Anthropic's native auth; omit/"bearer" for gateways that expect Authorization: Bearer
    models:
      claude-sonnet-4-6: {}
      claude-haiku-4-5: {}

server:
  # Base URL for agent OTLP/proxy endpoint configuration.
  # When set, overrides 'host' for URL generation (e.g. http://my-nas).
  # Ports still come from port/api_port/otlp_port below.
  # Leave commented for local-only usage (defaults to http://localhost).
  # base_url: http://my-nas
  host: 127.0.0.1       # bind address: 127.0.0.1 = local only, 0.0.0.0 = all interfaces
  port: 4000
  api_port: 4001

db:
  path: ~/.llm-tracker/usage.db
  # For PostgreSQL/MySQL, use `url` instead of `path`, for example:
  # url: postgresql+psycopg://user:password@db-host:5432/llm_tracker
  # url: mysql+pymysql://user:password@db-host:3306/llm_tracker
