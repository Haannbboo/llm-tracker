name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm ci
        working-directory: plugins/opencode

      - name: Install Kilo plugin dependencies
        run: npm ci
        working-directory: plugins/kilo

      - name: Build plugins
        run: npm run build --prefix plugins/opencode && npm run build --prefix plugins/kilo

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test config
        run: |
          mkdir -p ~/.llm-tracker
          cp config.example.yaml ~/.llm-tracker/config.yaml

      - name: Ruff format and lint
        run: python -m ruff format --check . && python -m ruff check src/ client/ protocol/ scripts/ tests/

      - name: Mypy type check
        run: python -m mypy src/ client/ protocol/ scripts/ --ignore-missing-imports

      - name: Run backend tests with coverage
        run: python -m pytest -q -n auto --cov=src --cov=scripts --cov-report=term-missing --cov-fail-under=75

  hosted-client:
    name: Hosted install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm ci
        working-directory: plugins/opencode

      - name: Install Kilo plugin dependencies
        run: npm ci
        working-directory: plugins/kilo

      - name: Build plugins from source
        run: npm run build --prefix plugins/opencode && npm run build --prefix plugins/kilo

      - name: Install client test dependencies
        run: python -m pip install -r client/requirements.txt pytest

      - name: Test source install, login, and plugin builds
        run: python -m pytest tests/client/ tests/scripts/test_hosted_install.py tests/scripts/test_configure_opencode_plugin.py tests/scripts/test_configure_kilo_plugin.py -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-package-lock

      - name: Build frontend
        run: npm run build
