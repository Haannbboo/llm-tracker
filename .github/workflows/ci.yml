name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode plugin dependencies
        run: npm install
        working-directory: plugins/opencode

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test config
        run: |
          mkdir -p ~/.llm-tracker
          cp config.example.yaml ~/.llm-tracker/config.yaml

      - name: Ruff format and lint
        run: python -m ruff format --check . && python -m ruff check src/ config/ scripts/ tests/

      - name: Mypy type check
        run: python -m mypy src/ config/ scripts/ --ignore-missing-imports

      - name: Run backend tests with coverage
        run: python -m pytest -q -n auto --cov=src --cov=config --cov=scripts --cov-report=term-missing --cov-fail-under=75

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-package-lock

      - name: Build frontend
        run: npm run build
