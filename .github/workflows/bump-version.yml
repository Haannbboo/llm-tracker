name: bump-version

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump changed package versions
        id: bump
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          BUMP_SERVER=false
          BUMP_CLIENT=false
          while IFS= read -r FILE; do
            case "$FILE" in
              protocol/*|scripts/configure-*)
                BUMP_SERVER=true
                BUMP_CLIENT=true
                ;;
              client/*|plugins/*|scripts/hosted-install.sh)
                BUMP_CLIENT=true
                ;;
              server/*|src/*|frontend/*|scripts/*|requirements.txt|config.example.yaml|install.sh|Dockerfile|VERSION)
                BUMP_SERVER=true
                ;;
            esac
          done < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          bump_file() {
            local FILE="$1"
            local CURRENT_VERSION BASE_VERSION CURRENT_MAJOR CURRENT_MINOR BASE_MAJOR BASE_MINOR BASE_PATCH NEW
            CURRENT_VERSION=$(cat "$FILE")
            BASE_VERSION=$(git show "origin/${{ github.base_ref }}:$FILE" 2>/dev/null || echo "0.0.0")
            if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "$FILE must use MAJOR.MINOR.PATCH format, got: $CURRENT_VERSION" >&2
              exit 1
            fi
            CURRENT_MAJOR="${BASH_REMATCH[1]}"
            CURRENT_MINOR="${BASH_REMATCH[2]}"
            if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Base $FILE must use MAJOR.MINOR.PATCH format, got: $BASE_VERSION" >&2
              exit 1
            fi
            BASE_MAJOR="${BASH_REMATCH[1]}"
            BASE_MINOR="${BASH_REMATCH[2]}"
            BASE_PATCH="${BASH_REMATCH[3]}"
            if [[ "$CURRENT_MAJOR.$CURRENT_MINOR" != "$BASE_MAJOR.$BASE_MINOR" ]]; then
              NEW="$CURRENT_VERSION"
            else
              NEW="$BASE_MAJOR.$BASE_MINOR.$((BASE_PATCH + 1))"
            fi
            echo "$NEW" > "$FILE"
            echo "$NEW"
          }

          VERSIONS=()
          if [[ "$BUMP_SERVER" == true ]]; then
            NEW_SERVER=$(bump_file VERSION)
            VERSIONS+=("server $NEW_SERVER")
          fi
          if [[ "$BUMP_CLIENT" == true ]]; then
            NEW_CLIENT=$(bump_file client/VERSION)
            VERSIONS+=("client $NEW_CLIENT")
          fi
          if (( ${#VERSIONS[@]} > 0 )); then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=${VERSIONS[*]}" >> "$GITHUB_OUTPUT"
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.bump.outputs.changed == 'true'
        with:
          commit_message: "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          file_pattern: VERSION client/VERSION
