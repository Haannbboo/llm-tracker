repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: frontend/tsconfig.*\.json
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run python -m mypy
        args: [src/, config/, scripts/, --ignore-missing-imports]
        language: system
        pass_filenames: false
      - id: otlp-ready
        name: check-otlp-ready
        entry: uv run python scripts/check-otlp-ready.py
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run python -m pytest
        args: ["-q", "-m", "not slow", "-n", "auto", "--cov=src", "--cov-fail-under=75"]
        language: system
        pass_filenames: false
