repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [src/, config/, --ignore-missing-imports]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run python -m pytest
        args: ["-q", "-m", "not slow", "--cov=src", "--cov-fail-under=70"]
        language: system
        pass_filenames: false
